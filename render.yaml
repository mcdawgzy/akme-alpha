services:
  - type: web
    name: akme-alpha-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn akme_alpha.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: FRED_API_KEY
        value: "your_32_char_fred_key_here"
    autoDeploy: true
    healthCheckPath: /api/health

cron:
  - name: yield-curve-daily
    schedule: "0 6 * * *"
    job: python /opt/render/project/scripts/run_yield_curve_daily.py

  - name: 13f-daily
    schedule: "0 6 * * *"
    job: python /opt/render/project/scripts/run_13f_daily.py

  - name: si-daily
    schedule: "0 6 * * *"
    job: python /opt/render/project/scripts/run_short_interest_daily.py

  - name: si-quarterly
    schedule: "0 6 15 2,5,8,11 *"
    job: python /opt/render/project/scripts/run_13f_quarterly.py

  - name: regime-indicator
    schedule: "0 6:30 * * *"
    job: python /opt/render/project/scripts/regime_indicator.py

# Database: Downloaded from GitHub Release on cold-start (v1.0.0)
# Free tier: 512MB RAM, 1GB disk, 100GB bandwidth/month
