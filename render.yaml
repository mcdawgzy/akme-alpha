services:
  - type: web
    name: akme-alpha-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn akme_alpha.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: FRED_API_KEY
        value: "your_32_char_fred_key_here"  # Replace with real key for CPI/PPI data
    # Rate limiting: API keys stored in SQLite, counts tracked daily
    autoDeploy: true
    healthCheckPath: /api/health
    # Scale to zero after 15 min idle (Render free tier behavior)
    # Pre-warm with keep-alive cron job if available

cron:
  - name: yield-curve-daily
    schedule: "0 6 * * *"  # 6 AM UTC+10 daily
    job: python /opt/render/project/scripts/run_yield_curve_daily.py

  - name: si-daily
    schedule: "0 6 * * *"  # 6 AM UTC+10 daily
    job: python /opt/render/project/scripts/run_short_interest_daily.py

  - name: si-quarterly
    schedule: "0 6 15 2,5,8,11 *"  # 6 AM UTC+10 quarterly
    job: python /opt/render/project/scripts/run_13f_quarterly.py

# Disk: SQLite DB at /opt/render/project/data/
# Free tier: 512MB RAM, 1GB disk, 100GB bandwidth/month
# Cold start: ~30s first request (DB init + uvicorn spin-up)

# Disk: SQLite DB is in repo, no persistence needed for read-only API
